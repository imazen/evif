name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  adversarial:
    runs-on: ubuntu-latest
    env:
      EVIF_E_MODEL: ${{ github.workspace }}/models/rev7_general_h128_2026-10-27.bin
      EVIF_ECODEC_MODEL: ${{ github.workspace }}/models/rev7_codec_h128_2026-10-27.bin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: python3 tools/adversarial_models.py models
      - run: cargo clippy -p evif-probe --features adversarial-models-test,trade --all-targets -- -D warnings
      - run: cargo test -p evif-probe --features adversarial-models-test,trade --lib

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools/contracts -p 'test_*.py' -v
      - run: cargo fmt --all --check
      # The external-checkpoint JPEG AI test has its own explicit feature gate.
      - run: cargo clippy --all-targets --features possession -- -D warnings

  # The whole workspace: container plus the probe with its pinned codecs and
  # metrics.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The codec-corpus git dependency holds conformance files whose paths
      # exceed Windows' default 260-character limit.
      - if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --features possession --release -- --test-threads=1
      - run: cargo test --doc

  # The container crate on 32-bit, and without std.
  container-i686:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
      - run: cross test -p evif --target i686-unknown-linux-gnu
      - run: cargo build -p evif --no-default-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p evif

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --all-targets --release --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
