[package]
name = "evif-probe"
version = "0.0.1"
description = "Stress families, metric judges and a matched-bitrate disagreement search that write EVIF files"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "evif"
path = "src/main.rs"

[features]
default = []
adversarial = ["dep:zensim-research", "dep:ssim2-frozen", "dep:sha2"]
# Caller-controlled test gate: both exact external model files are mandatory.
adversarial-models-test = ["adversarial"]
# Trade ladders, byte-matched pairs and the DE trade search: adds the CVVDP judge.
trade = ["adversarial", "possession-svt", "dep:cvvdp"]
# Larger experimental codec dependencies; the container remains unchanged.
possession = ["possession-svt", "possession-jxl", "possession-jpegai", "possession-coolchic"]
possession-svt = ["dep:zenavif", "dep:almost-enough"]
possession-jxl = ["dep:zenjxl"]
possession-jpegai = ["dep:zenjpegai", "dep:sha2"]
possession-coolchic = ["dep:zencoolchic", "dep:zenpixels"]
# Explicit oracle gate: this test requires externally supplied upstream checkpoints.
jpegai-models-test = ["possession-jpegai"]

[dependencies]
zensim-research = { package = "zensim", git = "https://github.com/imazen/zensimx", rev = "a4a00e250b89c1217a110100f16c6b1e1ef2f929", default-features = false, features = ["avx512", "imgref", "feature-regime-v2", "custom-profiles"], optional = true }
# Exact published source: VCS b7c2b4b33f3a26b753caabd5264a7fef9c4f4545.
ssim2-frozen = { package = "fast-ssim2", version = "=0.8.2", features = ["imgref", "hdr-pu"], optional = true }
almost-enough = { version = "0.4.5", optional = true }
# Third reference judge of the trade ladders; the revision the chroma diagnostics ran.
cvvdp = { git = "https://github.com/imazen/zenmetrics", rev = "0a61830db89a768ab9462f166d1412e948e4efa9", default-features = false, features = ["std"], optional = true }
zenavif = { git = "https://github.com/imazen/zenavif", rev = "a7638f6e0655914fb15fe4633ac26425533756c8", default-features = false, features = ["zenav1-svt", "__expert"], optional = true }
zenjxl = { git = "https://github.com/imazen/zenjxl", rev = "3f5e22e9cf8e2d58311af183d3f20454deeae6be", default-features = false, features = ["encode", "decode", "__expert"], optional = true }
zenjpegai = { git = "https://github.com/imazen/zenjpegai", rev = "1192fca6b6c2fdc4dcf29a6c8064c53a987caf59", default-features = false, features = ["std", "pth"], optional = true }
sha2 = { version = "0.11.1", default-features = false, optional = true }
zencoolchic = { git = "https://github.com/imazen/zencoolchic", rev = "1cecd62037dd8a8fe14a8a46d872ae7165538b33", default-features = false, features = ["encoder", "zencodec"], optional = true }
zencodec = { version = "0.1.26", default-features = false }
zenpixels = { version = "0.2.16", default-features = false, optional = true }
evif = { path = "../evif" }
# Codecs and metrics are pinned to main revisions; `src/pins.rs` records the
# same revisions for the `scor` and `knob` chunks. Update both together.
# The research probe needs the pinned raw XYB table constructors, exposed by
# this existing instrumentation feature. No codec algorithm is substituted.
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "a2a128ab0bc36f01338225f61c285f462ae67ca6", features = ["__test-utils"] }
zenpng = { git = "https://github.com/imazen/zenpng", rev = "2802f8ee9ae5444b61c4b8f9da51645365bb1fd5", default-features = false, features = ["quantize"] }
zensim = { git = "https://github.com/imazen/zensimx", rev = "2b84071712ef86bc95f7fdfc0b14b7ee14d2aaeb" }
fast-ssim2 = { git = "https://github.com/imazen/fast-ssim2", rev = "54fabca919230767ba0944cbec0a37d7eb3a2a7a" }
# No `rayon`: keep a thread pool out of the score so a file's recorded values
# depend on pixels alone.
butteraugli = { git = "https://github.com/imazen/butteraugli", rev = "02b570b490dda0f2593aca99260ed34ab062d5b3", default-features = false, features = ["avx512"] }
corruption-corpus = { git = "https://github.com/imazen/codec-corpus", rev = "ac980c295cb62c925d03d47990925d49c36eef18" }
# Registry requirement so the workspace patch (and a companion workspace's own
# patch) decides the one zenpixels-convert every crate sees.
zenpixels-convert = { version = "0.2.16", features = ["rgb"] }
zenquant = "0.1.3"
imgref = "1.12.3"
rgb = "0.8.53"
enough = "0.4.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zenhash = { git = "https://github.com/imazen/zenhash", rev = "7774776d2eb7b27da06efd8e090df60fa08e9bb8", version = "0.1.0" }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]

[[example]]
name = "chroma_hdr"
required-features = ["possession-svt"]
